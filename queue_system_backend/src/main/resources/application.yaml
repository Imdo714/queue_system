spring:
  application:
    name: queue
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}
      ssl:
        enabled: true

server:
  port: 8080

logging:
  level:
    com.queue: DEBUG
    org.springframework.data.redis: DEBUG
    io.lettuce.core: DEBUG